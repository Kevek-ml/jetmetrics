[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "jetmetrics"
version = "0.1.0"
description = "Arrow-native, Rust-based statistical metrics for ML monitoring"
requires-python = ">=3.10"
authors = [{name = "Kevek ML"}]
license = {text = "Apache-2.0"}
readme = "README.md"
repository = "https://github.com/Kevek-ml/jetmetrics"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "scipy>=1.11",
    "numpy>=1.25",
    "pyarrow>=14.0",
    "polars>=1.0",
]

[tool.maturin]
python-source = "python"
module-name = "jetmetrics._core"
